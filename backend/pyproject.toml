
[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btp-ai-operations-backend"
version = "0.1.0"
description = "SAP BTP AI Operations and Architecture Agent"
requires-python = ">=3.11,<3.15"

dependencies = [
    # FastAPI Backend
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",

    # PostgreSQL
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pgvector>=0.3,<1.0",

    # DeepSeek AI + Multi-Agent
    "langchain-deepseek>=1.1,<2.0",
    "langgraph>=1.2,<2.0",

    # HTTP and SAP API Integration
    "httpx>=0.27,<1.0",

    # Authentication
    "PyJWT[crypto]>=2.9,<3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.8"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
